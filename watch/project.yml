# Generated project so the watch app is reproducible from source:
#   brew install xcodegen && cd watch && xcodegen && make -C .. watch
name: AgentHUDWatch
options:
  bundleIdPrefix: dev.dhruv.agenthud
  deploymentTarget:
    watchOS: "11.0"
  createIntermediateGroups: true
targets:
  AgentHUDWatch:
    type: application
    platform: watchOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Agent HUD
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
        UILaunchStoryboardName: ""
        CFBundleURLTypes:
          - CFBundleURLName: AgentHUDPairing
            CFBundleURLSchemes: [agenthud]
        NSLocalNetworkUsageDescription: Connect securely to your paired Mac to show agent activity.
        # TLS with an explicitly paired certificate on local network hosts.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dhruv.agenthud.watch
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
